<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>SyTech Solutions — Find Your Path</title>
<meta name="description" content="What's slowing your records down? Answer three quick questions and see the path SyTech would take for your records project."/>
<link rel="stylesheet" href="assets/css/sytech-shared.css">
<script>
/* Arriving from the homepage bubble: start covered in the same navy, then reveal (see .rp-arrive CSS). */
(function () {
  try {
    if (sessionStorage.getItem('sytech-rp-arrive') === '1') {
      sessionStorage.removeItem('sytech-rp-arrive');
      if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
        document.documentElement.classList.add('rp-arrive');
        // safety net: never leave the cover up if the animation doesn't run
        setTimeout(function () { document.documentElement.classList.remove('rp-arrive'); }, 2200);
      }
    }
  } catch (e) {}
})();
</script>

<style>
/* ===== Page hero (standard page-hero band) ===== */
.page-hero { padding: 11rem 0 4.5rem; background: linear-gradient(175deg, var(--deep-navy) 0%, var(--navy) 60%, #2d5080 100%); position: relative; overflow: hidden; color: var(--white); }
.page-hero::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; }
.page-hero .container { position: relative; z-index: 1; }
.page-hero .eyebrow { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 1rem; }
.page-hero h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 700; line-height: 1.15; margin-bottom: 1.25rem; letter-spacing: -0.01em; }
.page-hero h1 span { color: var(--gold); }
.page-hero p.lead { font-size: 1.15rem; line-height: 1.7; color: rgba(255,255,255,0.82); max-width: 680px; }

/* ===== "Find Your Path" (namespaced .rp-*) ===== */
.rp-section { padding: 4rem 0 5rem; background: var(--light); }
.rp-card { position: relative; max-width: 760px; margin: 0 auto; background: #fff; border: 1px solid rgba(37,66,107,0.10); border-radius: 16px; box-shadow: 0 18px 50px rgba(37,66,107,0.10); padding: 2.25rem 2.5rem 2rem; overflow: hidden; }
.rp-card::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(37,66,107,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(37,66,107,0.05) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 65%); mask-image: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 65%); pointer-events: none; }
.rp-card > * { position: relative; }
.rp-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; min-height: 28px; }
.rp-count { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #6b7785; }
.rp-back { font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--navy); background: none; border: none; padding: 0.25rem 0; cursor: pointer; display: inline-flex; align-items: center; gap: 0.35rem; }
.rp-back[hidden] { display: none; }
.rp-progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 1.75rem; }
.rp-progress span { height: 5px; border-radius: 3px; background: rgba(37,66,107,0.10); transition: background 300ms ease; }
.rp-progress span.is-done { background: var(--gold); }
.rp-q h2 { font-size: clamp(1.35rem, 2.4vw, 1.7rem); font-weight: 700; color: var(--navy); line-height: 1.25; margin: 0 0 0.4rem; }
.rp-q .rp-hint { font-size: 0.92rem; color: var(--text-body); margin: 0 0 1.4rem; }
.rp-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin: 0; padding: 0; list-style: none; }
.rp-opt { width: 100%; height: 100%; display: flex; align-items: center; gap: 0.8rem; text-align: left; font: inherit; font-size: 0.97rem; font-weight: 700; line-height: 1.3; color: var(--navy); background: #fff; border: 1.5px solid rgba(37,66,107,0.16); border-radius: 12px; padding: 0.95rem 1rem; cursor: pointer; transition: border-color 200ms ease, background 200ms ease, transform 200ms ease, box-shadow 200ms ease; }
.rp-opt .rp-mark { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgba(37,66,107,0.35); display: inline-flex; align-items: center; justify-content: center; transition: background 200ms ease, border-color 200ms ease; }
.rp-opt.is-multi .rp-mark { border-radius: 5px; }
.rp-opt .rp-mark svg { opacity: 0; transition: opacity 150ms ease; }
.rp-opt[aria-pressed="true"] { border-color: var(--gold); background: rgba(229,166,48,0.09); }
.rp-opt[aria-pressed="true"] .rp-mark { background: var(--gold); border-color: var(--gold); }
.rp-opt[aria-pressed="true"] .rp-mark svg { opacity: 1; }
.rp-opt:disabled { cursor: default; opacity: 0.45; }
@media (hover: hover) and (pointer: fine) { .rp-opt:not(:disabled):hover { border-color: rgba(229,166,48,0.7); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,66,107,0.08); } }
.rp-opt:focus-visible, .rp-back:focus-visible, .rp-next:focus-visible, .rp-btn:focus-visible, .rp-link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.rp-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; }
.rp-field { display: flex; flex-direction: column; gap: 0.35rem; }
.rp-field span { font-size: 0.8rem; font-weight: 700; color: var(--navy); letter-spacing: 0.02em; }
.rp-field input { font: inherit; font-size: 1rem; color: var(--navy); padding: 0.8rem 0.9rem; border: 1.5px solid rgba(37,66,107,0.22); border-radius: 10px; background: #fff; transition: border-color 200ms ease, box-shadow 200ms ease; }
.rp-field input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(229,166,48,0.25); }
.rp-err { margin: 0.8rem 0 0; font-size: 0.88rem; color: #a3341f; font-weight: 700; }
.rp-err[hidden] { display: none; }
.rp-field-wide { grid-column: 1 / -1; }
.rp-other { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 0.55rem; }
.rp-other .rp-opt { height: auto; }
.rp-other-box input { width: 100%; box-sizing: border-box; font: inherit; font-size: 1rem; color: var(--navy); padding: 0.8rem 0.9rem; border: 1.5px solid rgba(37,66,107,0.22); border-radius: 10px; background: #fff; }
.rp-other-box input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(229,166,48,0.25); }
.rp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rp-result > p.rp-echo { font-style: italic; color: var(--navy); }
@media (max-width: 640px) { .rp-fields { grid-template-columns: 1fr; } }
.rp-foot { display: flex; justify-content: flex-end; margin-top: 1.4rem; min-height: 44px; }
.rp-next { font: inherit; font-size: 0.95rem; font-weight: 700; color: var(--deep-navy); background: var(--gold); border: none; border-radius: 8px; padding: 0.75rem 1.5rem; cursor: pointer; }
.rp-next:disabled { opacity: 0.4; cursor: default; }
.rp-next[hidden] { display: none; }
@keyframes rp-in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: no-preference) { .rp-q, .rp-result { animation: rp-in 320ms cubic-bezier(.2,.8,.2,1) both; } }

/* result */
.rp-verdict { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.4rem 0.8rem; border-radius: 999px; margin-bottom: 0.9rem; }
.rp-verdict.is-strong { background: rgba(61,184,122,0.14); color: #1f7a4d; }
.rp-verdict.is-talk { background: rgba(229,166,48,0.16); color: #8a5a0c; }
.rp-verdict.is-not { background: rgba(37,66,107,0.08); color: var(--navy); }
.rp-result h2 { font-size: clamp(1.45rem, 2.6vw, 1.9rem); font-weight: 700; color: var(--navy); line-height: 1.2; margin: 0 0 0.6rem; }
.rp-result > p { font-size: 1rem; line-height: 1.7; color: var(--text-body); margin: 0 0 1.4rem; }
.rp-path { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 0 0 1.4rem; }
.rp-phase { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; padding: 0.45rem 0.85rem; border-radius: 999px; border: 1.5px dashed rgba(37,66,107,0.22); color: #8a96a4; }
.rp-phase.is-on { border-style: solid; color: #fff; }
.rp-phase.is-on[data-ph="organize"] { background: #C2683A; border-color: #C2683A; }
.rp-phase.is-on[data-ph="unify"] { background: #2E7DB5; border-color: #2E7DB5; }
.rp-phase.is-on[data-ph="scale"] { background: #2E8F5E; border-color: #2E8F5E; }
.rp-arrow { color: #b0b9c4; }
.rp-services { display: grid; gap: 0.7rem; margin: 0 0 1.6rem; padding: 0; list-style: none; }
.rp-service { display: flex; gap: 1rem; align-items: flex-start; padding: 1rem 1.1rem; border: 1px solid rgba(37,66,107,0.12); border-left: 4px solid var(--gold); border-radius: 10px; background: #fff; }
.rp-service .rp-sv-ph { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.rp-service h3 { font-size: 1.05rem; font-weight: 700; color: var(--navy); margin: 0.15rem 0 0.25rem; }
.rp-service p { font-size: 0.9rem; line-height: 1.55; color: var(--text-body); margin: 0; }
.rp-service a { color: inherit; text-decoration: none; }
.rp-service a:hover h3 { text-decoration: underline; text-decoration-color: var(--rp-ph, var(--gold)); text-underline-offset: 3px; }
.rp-service[data-ph="organize"] { --rp-ph: #C2683A; --rp-ph-ink: #A9532A; }
.rp-service[data-ph="unify"]    { --rp-ph: #2E7DB5; --rp-ph-ink: #2A70A3; }
.rp-service[data-ph="scale"]    { --rp-ph: #2E8F5E; --rp-ph-ink: #287F53; }
.rp-service[data-ph] { border-left-color: var(--rp-ph); }
.rp-service[data-ph] .rp-sv-ph { color: var(--rp-ph-ink); }
.rp-result > p.rp-learn-head { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #6b7785; margin: 0 0 0.8rem; }
.rp-learn { display: grid; gap: 0.75rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
.rp-learn li { display: flex; gap: 0.9rem; align-items: flex-start; padding: 1rem 1.1rem; border-radius: 10px; background: var(--light); }
.rp-learn .rp-ico { flex-shrink: 0; width: 40px; height: 40px; border-radius: 10px; background: #fff; border: 1px solid rgba(37,66,107,0.12); display: inline-flex; align-items: center; justify-content: center; color: var(--navy); }
.rp-learn strong { display: block; color: var(--navy); font-size: 1rem; margin-bottom: 0.2rem; }
.rp-learn p { margin: 0; font-size: 0.92rem; line-height: 1.55; color: var(--text-body); }
.rp-better { margin: 0 0 1.4rem; padding: 1rem 1.2rem; border-left: 4px solid var(--gold); background: rgba(229,166,48,0.08); border-radius: 4px; }
.rp-better strong { display: block; color: var(--navy); margin-bottom: 0.3rem; }
.rp-better p { margin: 0; font-size: 0.95rem; line-height: 1.6; color: var(--text-body); }
.rp-result > p.rp-honest { font-size: 0.9rem; color: #6b7785; margin: 0 0 1.3rem; }
.rp-instead { margin: 0 0 1.6rem; padding: 1rem 1.2rem; border-radius: 10px; background: var(--light); }
.rp-instead strong { display: block; color: var(--navy); margin-bottom: 0.4rem; }
.rp-instead ul { margin: 0; padding-left: 1.2rem; color: var(--text-body); line-height: 1.6; font-size: 0.93rem; }
.rp-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.5rem; }
.rp-btn { display: inline-block; padding: 0.85rem 1.6rem; background: var(--gold); color: var(--deep-navy); font-weight: 700; font-size: 0.95rem; border-radius: 8px; text-decoration: none; }
.rp-link { font: inherit; font-size: 0.9rem; font-weight: 700; color: var(--navy); background: none; border: none; border-bottom: 2px solid var(--gold); padding: 0 0 0.1rem; cursor: pointer; text-decoration: none; }

@media (max-width: 640px) {
  .page-hero { padding: 9rem 0 3.5rem; }
  .rp-card { padding: 1.6rem 1.25rem 1.5rem; border-radius: 12px; }
  .rp-options { grid-template-columns: 1fr; }
}

/* arrival from the homepage bubble: the navy lifts away, the heading eases in, the survey card rises */
html.rp-arrive body::after { content: ''; position: fixed; inset: 0; z-index: 3000; pointer-events: none;
  background: radial-gradient(circle at 30% 10%, #2E7DB5 0%, #25426B 35%, #1a2c42 75%);
  animation: rp-lift 800ms cubic-bezier(.65,0,.35,1) 150ms both; }
@keyframes rp-lift { from { opacity: 1; } to { opacity: 0; visibility: hidden; } }
html.rp-arrive .page-hero .container > * { animation: rp-up 700ms cubic-bezier(.2,.8,.2,1) both; }
html.rp-arrive .page-hero .eyebrow { animation-delay: 450ms; }
html.rp-arrive .page-hero h1 { animation-delay: 520ms; }
html.rp-arrive .page-hero p.lead { animation-delay: 600ms; }
html.rp-arrive .rp-card { animation: rp-rise 800ms cubic-bezier(.2,.9,.25,1.1) 700ms both; }
@keyframes rp-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes rp-rise { from { opacity: 0; transform: translateY(60px) scale(0.96); } to { opacity: 1; transform: none; } }
</style>

<script>
/* "Find Your Path": three questions and a short contact step, then the
   path we would take (Organize, Unify, Scale) with matching services.
   Answers stay in the page; nothing is sent anywhere. */
(function () {
  'use strict';
  var root = document.getElementById('rp-app');
  if (!root) return;

  var QUESTIONS = [
    { id: 'pain', title: 'What\'s slowing you down right now?', hint: 'Pick up to two.', multi: 2,
      options: [
        { v: 'space', t: 'Running out of space, or a move coming up' },
        { v: 'find', t: 'Finding records fast, like for public records requests' },
        { v: 'forms', t: 'Paper forms and approvals' },
        { v: 'legacy', t: 'An old system that costs too much and is hard to leave' },
        { v: 'audit', t: 'Retention rules and audit readiness' },
        { v: 'archive', t: 'A huge archive nobody can search' },
        { v: 'other', t: 'Other', other: true }
      ] },
    { id: 'records', title: 'Where do your records live today?', hint: 'Pick the closest match.',
      options: [
        { v: 'paper', t: 'Mostly paper' },
        { v: 'mix', t: 'A mix of paper and digital' },
        { v: 'legacy', t: 'An older records system' },
        { v: 'cloud', t: 'Already in Microsoft 365 or Google' },
        { v: 'unsure', t: 'Not sure' }
      ] },
    { id: 'urgency', title: 'What\'s making this urgent right now?', hint: 'Pick the closest match.',
      options: [
        { v: 'move', t: 'A building move or space deadline' },
        { v: 'request', t: 'An audit or records request' },
        { v: 'budget', t: 'Budget pressure' },
        { v: 'retiring', t: 'A system being retired' },
        { v: 'turnover', t: 'Staff turnover' },
        { v: 'none', t: 'No deadline, just exploring' }
      ] },
    { id: 'contact', type: 'contact', title: 'Last step: where should we send your path?',
      hint: 'Enter your name, work email, and organization to see your result.' }
  ];

  // Services the result can recommend (phase, page, and a line tied to the visitor's answer).
  var SERVICES = {
    scanning:   { ph: 'organize', name: 'Archive Scanning', href: 'services-scanning.html', why: 'Get paper out of storage rooms and into searchable digital records.' },
    migration:  { ph: 'organize', name: 'Data Migration', href: 'services-data-migration.html', why: 'Move records out of the old system with their structure intact.' },
    compliance: { ph: 'organize', name: 'Records Management & Compliance', href: 'services-compliance-setup.html', why: 'Set up retention rules and structure that hold up under an audit.' },
    oneform:    { ph: 'unify', name: 'OneForm', href: 'services-oneform.html', why: 'Turn paper forms into online forms with approvals built in.' },
    sharepoint: { ph: 'unify', name: 'SharePoint ERMS', href: 'services-sharepoint-erms.html', why: 'Find any record in seconds, inside the Microsoft 365 you already own. On Google, or want us to run it for you? 1DocStop does the same job.' },
    ai:         { ph: 'scale', name: 'AI-Powered Ingestion', href: 'services-ai-ingestion.html', why: 'Read, sort, and index a large archive automatically.' }
  };
  var PHASE_ORDER = ['organize', 'unify', 'scale'];

  // One line for the result, tied to what is making it urgent.
  var URGENCY = {
    move: 'With a move or space deadline coming, we\'d start with the records that have to leave the building first.',
    request: 'With an audit or records request in front of you, we\'d start with the records you need to find first.',
    budget: 'With budget pressure, we\'d start where it saves the most, like making better use of the Microsoft 365 you already pay for.',
    retiring: 'With a system being retired, we\'d start by getting your records out safely, with their structure intact, before the deadline.',
    turnover: 'With staff turnover, we\'d start by building the know-how into the system, so your records don\'t depend on one person.',
    none: 'No deadline is a good place to be. It gives us room to plan the path right before anything moves.'
  };

  var answers = {}, step = 0;

  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  var CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1a2c42" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function frame(inner, showBack) {
    var dots = QUESTIONS.map(function (_, i) { return '<span class="' + (i < step || step >= QUESTIONS.length ? 'is-done' : '') + '"></span>'; }).join('');
    root.innerHTML =
      '<div class="rp-top"><span class="rp-count">' + (step < QUESTIONS.length ? 'Step ' + (step + 1) + ' of ' + QUESTIONS.length : 'Your path') + '</span>' +
      '<button type="button" class="rp-back"' + (showBack ? '' : ' hidden') + '>&larr; Back</button></div>' +
      '<div class="rp-progress" aria-hidden="true">' + dots + '</div>' + inner;
    var back = root.querySelector('.rp-back');
    back.addEventListener('click', function () { step = Math.max(0, step - 1); render(); });
  }

  function render() {
    if (step >= QUESTIONS.length) return renderResult();
    var q = QUESTIONS[step], picked = answers[q.id];
    if (q.type === 'contact') return renderContact(q);
    var opts = q.options.map(function (o) {
      var on = q.multi ? (picked || []).indexOf(o.v) !== -1 : picked === o.v;
      return '<li' + (o.other ? ' class="rp-other"' : '') + '><button type="button" class="rp-opt' + (q.multi ? ' is-multi' : '') + '" data-v="' + o.v + '" aria-pressed="' + on + '">' +
        '<span class="rp-mark">' + CHECK + '</span><span>' + esc(o.t) + '</span></button>' +
        (o.other ? '<label class="rp-other-box"' + (on ? '' : ' hidden') + '><span class="rp-sr">Tell us what\'s slowing you down</span>' +
          '<input type="text" maxlength="160" placeholder="Tell us in a few words" value="' + esc(answers.otherText || '') + '"></label>' : '') +
        '</li>';
    }).join('');
    frame('<div class="rp-q" role="group" aria-labelledby="rp-q-title"><h2 id="rp-q-title" tabindex="-1">' + esc(q.title) + '</h2>' +
      (q.hint ? '<p class="rp-hint">' + esc(q.hint) + '</p>' : '<p class="rp-hint">&nbsp;</p>') +
      '<ul class="rp-options" role="list">' + opts + '</ul>' +
      '<div class="rp-foot"><button type="button" class="rp-next"' + (q.multi ? '' : ' hidden') + '>Continue &rarr;</button></div></div>', step > 0);
    var next = root.querySelector('.rp-next'), otherBox = root.querySelector('.rp-other-box');
    if (otherBox) otherBox.querySelector('input').addEventListener('input', function (e) { answers.otherText = e.target.value; });
    function syncMulti() {
      var list = answers[q.id] || [], n = list.length;
      next.disabled = n === 0;
      Array.prototype.forEach.call(root.querySelectorAll('.rp-opt'), function (b) {
        b.disabled = n >= q.multi && b.getAttribute('aria-pressed') !== 'true';
      });
      if (otherBox) otherBox.hidden = list.indexOf('other') === -1;
    }
    root.querySelectorAll('.rp-opt').forEach(function (b) {
      b.addEventListener('click', function () {
        var v = b.getAttribute('data-v');
        if (q.multi) {
          var list = (answers[q.id] || []).slice(), i = list.indexOf(v);
          if (i === -1) list.push(v); else list.splice(i, 1);
          answers[q.id] = list;
          b.setAttribute('aria-pressed', i === -1 ? 'true' : 'false');
          syncMulti();
          if (v === 'other' && i === -1) otherBox.querySelector('input').focus();
          return;
        }
        answers[q.id] = v;
        root.querySelectorAll('.rp-opt').forEach(function (o) { o.setAttribute('aria-pressed', o === b ? 'true' : 'false'); });
        setTimeout(function () { step++; render(); }, 220);
      });
    });
    if (q.multi) { syncMulti(); next.addEventListener('click', function () { step++; render(); }); }
    var h = root.querySelector('#rp-q-title'); if (h && step > 0) h.focus({ preventScroll: true });
  }

  // Last step: name, email, organization (all required). Demo only: nothing is sent or saved anywhere.
  function renderContact(q) {
    var c = answers.contact || { name: '', email: '', org: '' };
    frame('<form class="rp-q rp-contact" novalidate aria-labelledby="rp-q-title"><h2 id="rp-q-title" tabindex="-1">' + esc(q.title) + '</h2>' +
      '<p class="rp-hint">' + esc(q.hint) + '</p>' +
      '<div class="rp-fields">' +
        '<label class="rp-field"><span>Full name</span><input type="text" name="name" autocomplete="name" required value="' + esc(c.name) + '"></label>' +
        '<label class="rp-field"><span>Work email</span><input type="email" name="email" autocomplete="email" inputmode="email" required value="' + esc(c.email) + '"></label>' +
        '<label class="rp-field rp-field-wide"><span>Organization</span><input type="text" name="org" autocomplete="organization" required value="' + esc(c.org) + '"></label>' +
      '</div>' +
      '<p class="rp-err" role="alert" hidden>Please enter your name, a valid email address, and your organization.</p>' +
      '<div class="rp-foot"><button type="submit" class="rp-next">See my path &rarr;</button></div></form>', true);
    var form = root.querySelector('.rp-contact'), nameIn = form.elements.name, emailIn = form.elements.email, orgIn = form.elements.org,
        btn = form.querySelector('.rp-next'), err = form.querySelector('.rp-err');
    var EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    function valid() { return nameIn.value.trim().length > 0 && EMAIL.test(emailIn.value.trim()) && orgIn.value.trim().length > 0; }
    function sync() { btn.disabled = !valid(); if (valid()) err.hidden = true; }
    [nameIn, emailIn, orgIn].forEach(function (i) { i.addEventListener('input', sync); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!valid()) { err.hidden = false; return; }
      answers.contact = { name: nameIn.value.trim(), email: emailIn.value.trim(), org: orgIn.value.trim() };
      step++; render();
    });
    sync();
    nameIn.focus({ preventScroll: true });
  }

  function firstName() {
    var n = (answers.contact && answers.contact.name) || '';
    return n.split(/\s+/)[0] || '';
  }
  function named(line) {   // "Ethan, here's where we'd start." when we have a name
    var f = firstName();
    return f ? esc(f) + ', ' + line.charAt(0).toLowerCase() + line.slice(1) : line;
  }

  function decide() {
    var a = answers, pains = a.pain || [], pick = [];
    function add(k) { if (pick.indexOf(k) === -1) pick.push(k); }
    if (a.records === 'paper' || a.records === 'mix' || pains.indexOf('space') !== -1 || a.urgency === 'move') add('scanning');
    if (a.records === 'legacy' || pains.indexOf('legacy') !== -1 || a.urgency === 'retiring') add('migration');
    if (pains.indexOf('audit') !== -1) add('compliance');
    if (pains.indexOf('forms') !== -1) add('oneform');
    if (pains.indexOf('find') !== -1 || a.records === 'cloud' || a.urgency === 'request') add('sharepoint');
    if (pains.indexOf('archive') !== -1) add('ai');
    pick.sort(function (x, y) { return PHASE_ORDER.indexOf(SERVICES[x].ph) - PHASE_ORDER.indexOf(SERVICES[y].ph); });
    pick = pick.slice(0, 3);
    // Vague answers ("Other" only, or not sure where records live) get a "let's talk" result.
    var onlyOther = pains.length === 1 && pains[0] === 'other';
    var talk = onlyOther ? 'other' : a.records === 'unsure' ? 'unsure' : !pick.length ? 'other' : '';
    return { talk: talk, services: pick };
  }

  function renderResult() {
    var r = decide(), html = '';
    var phases = {}; r.services.forEach(function (k) { phases[SERVICES[k].ph] = true; });
    var path = '<div class="rp-path" aria-label="Your likely path">' + PHASE_ORDER.map(function (p, i) {
      return (i ? '<span class="rp-arrow" aria-hidden="true">&rarr;</span>' : '') +
        '<span class="rp-phase' + (phases[p] ? ' is-on' : '') + '" data-ph="' + p + '">' + p.charAt(0).toUpperCase() + p.slice(1) + '</span>';
    }).join('') + '</div>';
    var services = '<ul class="rp-services" role="list">' + r.services.map(function (k) {
      var s = SERVICES[k];
      return '<li class="rp-service" data-ph="' + s.ph + '"><a href="' + s.href + '"><span class="rp-sv-ph">' + s.ph + '</span><h3>' + esc(s.name) + '</h3><p>' + esc(s.why) + '</p></a></li>';
    }).join('') + '</ul>';
    var other = (answers.pain || []).indexOf('other') !== -1 && (answers.otherText || '').trim()
      ? '<p class="rp-echo">You told us: &ldquo;' + esc(answers.otherText.trim()) + '&rdquo;</p>' : '';
    var urgency = URGENCY[answers.urgency] ? '<p>' + URGENCY[answers.urgency] + '</p>' : '';
    var restart = '<button type="button" class="rp-link rp-restart">Start over</button>';

    if (r.talk) {
      var reason = r.talk === 'unsure'
        ? 'Not sure where your records live? That\'s completely normal. A short conversation is the fastest way to map what you have and find the right first step.'
        : 'Every records project is a little different, and yours sounds like one worth talking through. A short conversation is the fastest way to find the right first step.';
      html = '<div class="rp-result"><span class="rp-verdict is-talk">Let\'s talk</span>' +
        '<h2>' + named('Let\'s talk it through.') + '</h2>' + other + '<p>' + reason + '</p>' +
        (r.services.length ? '<p style="margin-bottom:0.8rem"><strong style="color:var(--navy)">Based on your answers, this is where we would likely start:</strong></p>' + path + services : '') +
        '<div class="rp-actions"><a class="rp-btn" href="contact.html">Request a Free Assessment</a>' + restart + '</div></div>';
    } else {
      html = '<div class="rp-result"><span class="rp-verdict is-strong">Your path</span>' +
        '<h2>' + named('Here\'s where we\'d start.') + '</h2>' + other + urgency +
        '<p>Based on your answers, here is the path we would likely recommend.</p>' +
        path + services +
        '<div class="rp-actions"><a class="rp-btn" href="contact.html">Request a Free Assessment</a>' + restart + '</div></div>';
    }
    frame(html, true);
    root.querySelector('.rp-restart').addEventListener('click', function () { answers = {}; step = 0; render(); });
    var h = root.querySelector('.rp-result h2'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  render();
})();
</script>

</body>
</html>
